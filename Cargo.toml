[workspace]
members = [
    "contracts/identity",
    "contracts/verification",
    "contracts/escrow",
    "contracts/financing",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
soroban-sdk = { version = "27.0.6" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
